<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Parcours du rover</title>
<output id="result" data-status="running"></output><iframe title="Colonie de test"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const output = document.querySelector('output');
const mobile = location.search === '?mobile';
frame.width = mobile ? '390' : '1366';
frame.height = mobile ? '844' : '900';
const one = selector => frame.contentDocument.querySelector(selector);
const state = () => JSON.parse(localStorage.getItem('neon-colony-v2'));
function check(condition, message) { if (!condition) throw new Error(message); }
function click(selector) {
  const button = one(selector);
  check(button && !button.disabled, 'Commande inaccessible : ' + selector);
  button.click();
}
function activate(selector) {
  const tile = one(selector);
  check(tile, 'Case absente : ' + selector);
  tile.focus();
  tile.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
}
function loadGame() {
  return new Promise(resolve => {
    frame.addEventListener('load', resolve, { once: true });
    frame.src = '../dist/';
  });
}
try {
  check(!state(), 'Ce parcours nécessite un profil de navigateur vierge.');
  await loadGame();
  const art = new Set([...frame.contentDocument.querySelectorAll('image[href$=".webp"], img[src$=".webp"]')]
    .map(el => el.getAttribute('href') || el.getAttribute('src')));
  art.add('./src/art/landing.webp');
  await Promise.all([...art].map(async source => {
    const img = new Image();
    img.src = new URL(source, frame.contentDocument.baseURI);
    await img.decode();
    check(img.naturalWidth > 0, 'Illustration illisible : ' + source);
  }));
  click('#begin');
  const map = one('#scene > svg');
  const pod = one('[data-tile="5,5"] .structure image');
  const podBox = pod.getBoundingClientRect();
  check(podBox.width >= 55, 'Module pionnier lisible au cadrage initial');
  const target = frame.contentDocument.elementFromPoint(podBox.left + podBox.width*.5, podBox.top + podBox.height*.65);
  check(target?.closest('[data-tile]')?.dataset.tile === '5,5', 'Zone de sélection du module illustré');
  target.dispatchEvent(new frame.contentWindow.MouseEvent('click', {bubbles:true}));
  check(one('#inspector h2').textContent === 'Module pionnier', 'Sélection au pointeur sur le bâtiment');
  const viewBox = map.getAttribute('viewBox');
  click('#overview');
  check(map === one('#scene > svg') && map.getAttribute('viewBox') !== viewBox, 'Vue d’ensemble');
  click('#center');
  check(map.getAttribute('viewBox') === viewBox, 'Recentrage');
  activate('#scene [data-node][aria-label^="Minerai"]');
  activate('#scene [data-node][aria-label^="Cristaux"]');
  check(state().harvests === 2 && map === one('#scene > svg'), 'Collecte sur la carte');
  click('#survey-open');
  click('[data-survey-select="prism"]');
  await one('.survey-landscape').decode();
  click('#survey-locate');
  const pin = one('[data-survey-site="prism"]');
  const pinBox = pin.getBoundingClientRect(), mapBox = one('#world').getBoundingClientRect();
  check(pinBox.left >= mapBox.left && pinBox.right <= mapBox.right && pinBox.top >= mapBox.top && pinBox.bottom <= mapBox.bottom, 'Localisation du site');
  activate('[data-survey-site="prism"]');
  click('[data-survey-project="hangar"]');
  activate('.buildable[data-tile="5,6"]');
  check(state().buildings.some(b => b.type === 'hangar'), 'Construction du hangar');
  click('#inspector .action');
  click('[data-survey-select="flora"]');
  const costs = { ...state().resources };
  click('#survey-start');
  check(one('[data-rover]') && state().survey.active.site === 'flora', 'Départ du rover');
  check(state().resources.water === costs.water - 4 && one('#survey-claim').disabled, 'Provisions et durée');
  await loadGame();
  click('#survey-open');
  check(one('[data-rover]') && one('#survey-claim').disabled, 'Reprise de la sortie');
  // Advance the game clock past arrival without modifying the save.
  frame.contentWindow.Date.now = () => state().survey?.active?.startedAt + 24001 || Date.now();
  click('#modal .close');
  click('#survey-open');
  click('#survey-claim');
  check(state().survey.completed.join() === 'flora' && !state().survey.active, 'Spécimen archivé');
  check(!one('#survey-claim') && !one('[data-rover]'), 'Cargaison récupérable une seule fois');
  check(one('.survey-cover h3').textContent === 'Fougère de verre', 'Rapport dans le carnet');
  const dialog = one('#modal');
  check(dialog.scrollWidth <= dialog.clientWidth && frame.contentDocument.documentElement.scrollWidth <= frame.contentWindow.innerWidth, 'Débordement horizontal');
  output.dataset.status = 'passed'; output.textContent = 'Parcours terminé.';
} catch (error) {
  output.dataset.status = 'failed'; output.textContent = error.stack;
}
</script></html>
