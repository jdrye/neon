name: Deploy Première Aube to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the complete adventure
        run: npm test
      - name: Build static game
        run: npm run build
      - name: Play the rover expedition on desktop and mobile layouts
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/neon-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/dist/ >/dev/null
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mkdir -p "$RUNNER_TEMP/neon-captures"
            npm run build:preview -- "$RUNNER_TEMP/neon-captures/NEON-Kepler.html"
          fi
          for layout in desktop mobile; do
            result="$RUNNER_TEMP/neon-$layout.html"
            google-chrome --headless --disable-gpu --no-sandbox --no-first-run \
              --user-data-dir="$RUNNER_TEMP/neon-profile-$layout" --virtual-time-budget=10000 \
              --dump-dom "http://127.0.0.1:4173/tests/rover.browser.html?$layout" >"$result"
            if ! grep -q '<output id="result" data-status="passed">' "$result"; then
              sed -n '/<output id="result"/,/<iframe/p' "$result" | head -c 3000
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              size=1440,1000
              if [ "$layout" = mobile ]; then size=390,844; fi
              google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
                --user-data-dir="$RUNNER_TEMP/neon-visual-$layout" --window-size="$size" \
                --force-device-scale-factor=1 --virtual-time-budget=4000 \
                --screenshot="$RUNNER_TEMP/neon-captures/kepler-$layout.png" \
                "file://$RUNNER_TEMP/neon-captures/NEON-Kepler.html"
              google-chrome --headless --disable-gpu --no-sandbox --virtual-time-budget=3000 \
                --user-data-dir="$RUNNER_TEMP/neon-visual-$layout" --dump-dom \
                "file://$RUNNER_TEMP/neon-captures/NEON-Kepler.html" >"$RUNNER_TEMP/neon-offline.html"
              grep -q 'data-build="observatory"' "$RUNNER_TEMP/neon-offline.html"
            fi
          done
      - name: Save playable preview and in-game screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kepler-en-jeu
          path: ${{ runner.temp }}/neon-captures/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
