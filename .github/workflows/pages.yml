name: Deploy Première Aube to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the complete adventure
        run: npm test
      - name: Build static game
        run: npm run build
      - name: Play the rover expedition and tidal campaign on desktop and mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/neon-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/dist/ >/dev/null
          npm run build:preview -- "$RUNNER_TEMP/neon-captures/NEON-Kepler.html"
          node scripts/test-browser.mjs http://127.0.0.1:4173 "$RUNNER_TEMP/neon-captures"
      - name: Save playable preview and in-game screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kepler-en-jeu
          path: ${{ runner.temp }}/neon-captures/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
