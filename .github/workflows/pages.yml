name: Deploy Pages

on:
  push:
    branches:
      - main
      - refonte/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install browser for gameplay checks
        run: npx playwright install --with-deps chromium

      - name: Verify production game
        run: npm test
        env:
          PLAYWRIGHT_TEST_BUILD: "1"
          PLAYWRIGHT_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Save gameplay verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-checks
          path: test-results/
          retention-days: 7

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
